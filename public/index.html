<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="20;url=https://xiaoheifk.com">
<meta name="robots" content="noindex,nofollow">
<title>域名更换通知</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        neon: '#00f0ff',
        darkbg: '#050816'
      },
      fontFamily: {
        mono: ['JetBrains Mono', 'Consolas', 'monospace']
      }
    }
  }
}
</script>
<style type="text/tailwindcss">
@layer utilities {
  .text-shadow-neon {
    text-shadow: 0 0 8px #00f0ff, 0 0 18px rgba(0,240,255,0.55);
  }
  .text-blink-neon {
    animation: blinkNeon 1.6s ease-in-out infinite alternate;
  }
  .border-neon {
    box-shadow: 0 0 12px rgba(0,240,255,0.35), inset 0 0 12px rgba(0,240,255,0.15);
  }
  .url-glow {
    box-shadow: 0 0 14px rgba(0,240,255,0.45);
  }
  .bg-grid {
    background-image:
      linear-gradient(rgba(0,240,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .animate-pulse-slow {
    animation: pulse 3s ease-in-out infinite;
  }
}
@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-12px); }
}
.animate-float {
  animation: float 4s ease-in-out infinite;
}
@keyframes blinkNeon {
  0% {
    text-shadow: 0 0 6px #00f0ff, 0 0 12px rgba(0,240,255,0.4);
    opacity: 0.85;
  }
  100% {
    text-shadow: 0 0 12px #00f0ff, 0 0 26px rgba(0,240,255,0.75);
    opacity: 1;
  }
}
</style>
</head>
<body class="bg-darkbg bg-grid min-h-screen flex items-center justify-center overflow-hidden font-mono text-white">
  <div class="absolute w-[500px] h-[500px] rounded-full bg-cyan-400/10 blur-[100px] animate-pulse-slow"></div>
  <div class="relative z-10 text-center px-6 max-w-2xl w-full">
    <!-- 公告栏 -->
    <div class="mb-8 border border-cyan-500/40 border-neon rounded-xl p-5 bg-black/40 backdrop-blur-md text-left">
      <div class="flex items-center gap-2 mb-3">
        <i class="fa fa-bullhorn text-neon text-shadow-neon text-xl"></i>
        <span class="text-neon font-bold text-lg">【重要公告】小黑服务站 · 域名迁移通知</span>
      </div>
      <p id="notice-reason" class="text-gray-200 leading-loose whitespace-pre-line">
因原域名线路不稳定、卡顿及线路bug，本站进行线路升级与服务优化。
旧域名即将一周后停用，请各位尽快保存新地址，更新浏览器收藏夹等。
      </p>
    </div>
    <div class="animate-float my-6">
      <i class="fa fa-exchange text-[80px] text-neon text-shadow-neon"></i>
    </div>
    <h1 class="text-[clamp(1.8rem,5vw,3rem)] font-bold text-neon text-shadow-neon mb-6 leading-tight">
      服务升级·线路升级优化 · 域名更换
    </h1>
    <p class="text-xl text-gray-200 mb-2">旧域名一周后正式关闭</p>
    <p class="text-gray-400 mb-8">新站点：小黑服务站</p>
    <!-- 核心域名区域，重点醒目 + 闪烁霓虹 -->
    <div class="inline-block border border-neon url-glow rounded-xl px-6 py-4 bg-black/50 backdrop-blur-md mb-8">
      <p class="text-gray-400 text-sm mb-2">🔗 新域名（点击复制）</p>
      <div class="flex items-center justify-center gap-4 flex-wrap">
        <p id="new-url" class="text-[clamp(1.4rem,3vw,2rem)] text-neon font-bold break-all text-blink-neon"></p>
        <button id="copyBtn" class="px-4 py-2 border border-cyan-500/50 rounded-lg hover:bg-cyan-400/20 transition-all text-lg">
          <i class="fa fa-copy"></i>
        </button>
      </div>
    </div>
    <!-- 倒计时跳转块 -->
    <div class="inline-block border border-cyan-500/40 border-neon rounded-xl p-6 bg-black/40 backdrop-blur-md w-full">
      <div class="w-full h-1.5 bg-gray-800 rounded overflow-hidden mb-5">
        <div id="progressBar" class="h-full bg-neon transition-all duration-1000"></div>
      </div>
      <p class="text-gray-300 mb-5 text-lg">
        <span id="count" class="text-neon text-2xl font-bold text-shadow-neon">20</span> 秒后自动跳转新站点
      </p>
      <button id="goBtn" class="px-10 py-3 border border-neon text-neon rounded-lg hover:bg-cyan-400/20 transition-all duration-300 active:scale-95 text-lg">
        <i class="fa fa-arrow-right mr-2"></i>立即前往新站点
      </button>
    </div>
    <p class="mt-10 text-gray-400">⚠️ 请务必保存新域名，旧地址到期将无法访问</p>
  </div>
  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-5 py-2 bg-neon text-black rounded-lg opacity-0 transition-opacity pointer-events-none font-bold">✅ 域名复制成功！</div>
<script>
const newDomain = "https://xiaoheifk.com";
document.getElementById("new-url").innerText = newDomain;
const noticeReason = `因原域名线路不稳定、卡顿及线路bug，本站进行线路升级与服务优化。
旧域名即将一周后停用，请各位尽快保存新地址，更新浏览器收藏夹等。`;
document.getElementById("notice-reason").innerText = noticeReason;
let time = 20;
const total = 20;
const countEl = document.getElementById('count');
const progressBar = document.getElementById('progressBar');
const btn = document.getElementById('goBtn');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
progressBar.style.width = "100%";
let timer = setInterval(() => {
  time--;
  countEl.innerText = time;
  progressBar.style.width = (time / total * 100) + "%";
  if (time <= 0) {
    clearInterval(timer);
    location.href = newDomain;
  }
}, 1000);
btn.onclick = () => {
  clearInterval(timer);
  location.href = newDomain;
}
copyBtn.onclick = async () => {
  try {
    await navigator.clipboard.writeText(newDomain);
    copyBtn.innerHTML = '<i class="fa fa-check"></i>';
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      copyBtn.innerHTML = '<i class="fa fa-copy"></i>';
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 1500);
  } catch (err) {
    alert("复制失败，请手动复制链接");
  }
}
</script>
</body>
</html>
