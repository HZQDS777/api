<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>邮箱管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<style>
:root{
  --primary:#165DFF;
  --primary-light:#E8F3FF;
  --dark-bg:#0F172A;
  --sidebar-bg:#1E293B;
  --card-bg:#1E293B;
  --text-primary:#F1F5F9;
  --text-secondary:#94A3B8;
  --border:#334155;
  --success:#00B42A;
  --warning:#FF7D00;
  --danger:#F53F3F;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Microsoft YaHei",sans-serif;
  background-color:var(--dark-bg);
  color:var(--text-primary);
  line-height:1.4;
}
.layout{display:flex;min-height:100vh;}
.sidebar{display:none;}
.main{width:100%;padding:12px 8px;}

.page-header{
  margin-bottom:16px;
}
.page-title h1{
  font-size:20px;
  font-weight:600;
}
.page-title p{
  font-size:12px;
  color:var(--text-secondary);
  margin-top:4px;
}

.card-row{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;
  margin-bottom:16px;
}
.stat-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 12px;
}
.stat-card .top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.stat-card .top i{
  width:36px;height:36px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  background:rgba(22,93,255,0.1);
  color:var(--primary);
}
.stat-card h3{
  font-size:12px;
  color:var(--text-secondary);
  font-weight:400;
}
.stat-card p.num{
  font-size:22px;
  font-weight:700;
  margin-top:4px;
}

.module-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 12px;
  margin-bottom:12px;
}
.module-card .card-title{
  font-size:15px;
  font-weight:600;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:6px;
}
.module-card .card-title i{color:var(--primary);}

.btn{
  padding:8px 12px;
  border-radius:6px;
  border:none;
  font-size:13px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-success{background:var(--success);color:#fff;}
.btn-warning{background:var(--warning);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-default{background:#334155;color:var(--text-primary);}
.btn-sm{padding:6px 10px;font-size:12px;}

.form-input{
  height:36px;
  padding:0 10px;
  background:#273444;
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text-primary);
  font-size:13px;
  outline:none;
  min-width:120px;
}

.table-wrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  width:100%;
}
.table{
  width:100%;border-collapse:collapse;min-width:800px;
}
.table th,.table td{
  padding:10px 8px;text-align:left;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;
}
.table th{
  background:#273444;color:var(--text-secondary);font-weight:500;
}

.action-bar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;
}
.pagination{
  display:flex;gap:4px;align-items:center;margin-top:12px;flex-wrap:wrap;
}
.pagination button{
  min-width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:12px;
}
.pagination button.active{
  background:var(--primary);border-color:var(--primary);color:#fff;
}

.upload-box{
  border:2px dashed var(--border);border-radius:8px;padding:20px 10px;text-align:center;cursor:pointer;
}
.upload-box:hover{
  border-color:var(--primary);background:rgba(22,93,255,0.05);
}
.upload-box i{font-size:28px;color:var(--primary);margin-bottom:10px;}
.upload-box p{color:var(--text-secondary);font-size:13px;}

/* 进度条样式（你原有） */
.progress-container {
  width: 100%;height: 6px;background: #334155;border-radius: 3px;margin: 10px 0;display: none;overflow: hidden;
}
.progress-bar {
  height: 100%;background: var(--primary);width: 0%;transition: width 0.3s ease;
}
.import-status {
  font-size: 12px;color: var(--text-secondary);margin-top: 6px;display: none;
}

.loading-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9999;
}
.loading-spinner{
  width:40px;height:40px;border:4px solid #334155;border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:9999;padding:10px;
}
.modal-content{
  background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:18px 16px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;
}
.modal-btn-group{
  display:flex;gap:8px;justify-content:flex-end;margin-top:16px;
}

.no-data{text-align:center;padding:25px 10px;color:var(--text-secondary);display:none;}
.password-text{font-family:monospace;font-size:12px;}
.refresh-token{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.remark-cell{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

#mail-modal .modal-content {
  width:100%;max-width:95%;max-height:85vh;overflow-y:auto;
}

#edit-modal .modal-content {
  max-width: 95%;
}

@media (max-width:480px){
  .stat-card p.num{font-size:20px;}
  .btn{padding:7px 10px;font-size:12px;}
  .form-input{min-width:110px;}
  .action-bar{gap:6px;}
}
</style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<div class="layout">
  <main class="main">
    <div class="page-header">
      <div class="page-title">
        <h1>邮箱管理</h1>
        <p>导入、分组、搜索、收件箱垃圾箱取件</p>
      </div>
    </div>

    <div class="card-row">
      <div class="stat-card">
        <div class="top"><i class="fas fa-envelope"></i></div>
        <h3>邮箱总数</h3>
        <p class="num" id="account-count">0</p>
      </div>
      <div class="stat-card">
        <div class="top"><i class="fas fa-folder"></i></div>
        <h3>分组数量</h3>
        <p class="num" id="group-count">1</p>
      </div>
    </div>

    <div class="module-card">
      <div class="card-title"><i class="fas fa-upload"></i> 导入邮箱数据</div>
      <div class="upload-box" id="upload-box">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>点击或拖拽TXT文件到此处上传</p>
        <div class="file-info" id="file-info" style="margin-top:10px;color:var(--primary);"></div>
        <input type="file" id="file-input" accept=".txt" style="display:none;">
      </div>

      <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="import-status" id="import-status">导入中：0 / 0</div>

      <div class="action-bar" style="margin-top:16px;">
        <input type="password" class="form-input" id="password" placeholder="验证密码" oninput="setPassword()">
        <input type="text" class="form-input" id="delimiter" placeholder="分隔符 例如 ----">
        <button class="btn btn-primary" onclick="importEmails()"><i class="fas fa-file-import"></i> 导入</button>
        <button class="btn btn-success" onclick="exportData()"><i class="fas fa-download"></i> 导出</button>
        <button class="btn btn-danger" onclick="batchDelete()"><i class="fas fa-trash"></i> 批量删</button>
        <button class="btn btn-danger btn-sm" onclick="deleteAllEmails()"><i class="fas fa-trash-alt"></i> 清空</button>
      </div>
    </div>

    <div class="module-card">
      <div class="card-title"><i class="fas fa-layer-group"></i> 分组管理</div>
      <div class="action-bar">
        <label style="color:var(--text-secondary);font-size:12px;">筛选：</label>
        <select class="form-input" id="group-filter" onchange="filterByGroup()"></select>

        <label style="color:var(--text-secondary);font-size:12px;">新增：</label>
        <input type="text" class="form-input" id="new-group" placeholder="分组名称">
        <button class="btn btn-primary btn-sm" onclick="createGroup()">创建</button>
        <button class="btn btn-danger btn-sm" onclick="deleteSelectedGroup()">删除</button>

        <label style="color:var(--text-secondary);font-size:12px;">批量改：</label>
        <select class="form-input" id="batch-group-select"></select>
        <button class="btn btn-success btn-sm" onclick="showBatchGroupConfirm()">应用</button>
      </div>
    </div>

    <div class="module-card">
      <div class="card-title"><i class="fas fa-search"></i> 搜索筛选</div>
      <div class="action-bar">
        <input type="text" class="form-input" id="email-search" placeholder="搜索邮箱/备注">
        <button class="btn btn-primary btn-sm" onclick="searchEmails()">搜索</button>
        <button class="btn btn-default btn-sm" onclick="clearSearch()">清空</button>
      </div>

      <div class="table-wrap">
        <table class="table" id="email-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="select-all"></th>
              <th>邮箱账号</th>
              <th>密码 <button class="password-toggle btn btn-sm btn-default" onclick="toggleAllPasswords()"><i class="fas fa-eye"></i></button></th>
              <th>分组</th>
              <th>备注</th>
              <th>ClientID</th>
              <th>RefreshToken</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="no-data" id="no-data">暂无邮箱数据</div>

      <div class="action-bar" style="justify-content:space-between;margin-top:12px;">
        <div class="pagination" id="pagination"></div>
        <select class="form-input" id="items-per-page" onchange="changeItemsPerPage(this.value)">
          <option value="5">5条/页</option>
          <option value="10">10条/页</option>
          <option value="20">20条/页</option>
          <option value="50">50条/页</option>
          <option value="100">100条/页</option>
        </select>
      </div>
    </div>

    <div class="module-card" id="mail-card" style="display:none;">
      <div class="card-title"><i class="fas fa-inbox"></i> 邮件列表</div>
      <div class="table-wrap">
        <table class="table" id="mail-table">
          <thead>
            <tr>
              <th>发件人</th>
              <th>主题</th>
              <th>日期</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modal-title">提示</h3>
    <p id="modal-message"></p>
    <div class="modal-btn-group">
      <button class="btn btn-primary" onclick="closeModal()">确定</button>
    </div>
  </div>
</div>

<div class="modal" id="confirm-modal">
  <div class="modal-content">
    <h3 id="confirm-title">确认操作</h3>
    <p id="confirm-message"></p>
    <div class="modal-btn-group">
      <button class="btn btn-default" onclick="closeConfirmModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmAction()">确认</button>
    </div>
  </div>
</div>

<div class="modal" id="edit-modal">
  <div class="modal-content">
    <h3>编辑邮箱信息</h3>
    <input type="hidden" id="edit-email-original">
    <div style="margin:12px 0;text-align:left;">
      <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:12px;">邮箱账号</label>
      <input class="form-input" style="width:100%;" id="edit-email" readonly>
    </div>
    <div style="margin:12px 0;text-align:left;">
      <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:12px;">账号密码</label>
      <input class="form-input" style="width:100%;" id="edit-password">
    </div>
    <div style="margin:12px 0;text-align:left;">
      <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:12px;">所属分组</label>
      <select class="form-input" style="width:100%;" id="edit-group"></select>
    </div>
    <div style="margin:12px 0;text-align:left;">
      <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:12px;">备注信息</label>
      <input class="form-input" style="width:100%;" id="edit-remark">
    </div>
    <div style="margin:12px 0;text-align:left;">
      <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:12px;">Client ID</label>
      <input class="form-input" style="width:100%;" id="edit-client-id">
    </div>
    <div style="margin:12px 0;text-align:left;">
      <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:12px;">Refresh Token</label>
      <input class="form-input" style="width:100%;" id="edit-refresh-token">
    </div>
    <div class="modal-btn-group">
      <button class="btn btn-default" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存修改</button>
    </div>
  </div>
</div>

<div class="modal" id="mail-modal">
  <div class="modal-content">
    <h3 id="mail-modal-title">邮件详情</h3>
    <p id="mail-modal-sender"></p>
    <p id="mail-modal-subject"></p>
    <p id="mail-modal-date"></p>
    <div id="mail-modal-content" style="word-wrap:break-word;"></div>
    <div class="modal-btn-group">
      <button class="btn btn-primary" onclick="closeMailModal()">关闭</button>
    </div>
  </div>
</div>

<div class="modal" id="batch-group-modal">
  <div class="modal-content">
    <h3>批量修改分组</h3>
    <p>确定将选中 <span id="selected-count">0</span> 个邮箱移入：<span id="target-group-name">默认分组</span>？</p>
    <div class="modal-btn-group">
      <button class="btn btn-default" onclick="closeBatchGroupModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmBatchGroup()">确认修改</button>
    </div>
  </div>
</div>

<script>
const ENCRYPT_KEY='xh_email_system_2024';
let mailData=[];
let originalMailData=[];
let currentMailPage=1;
const mailItemsPerPage=10;
let searchKeyword='';
let mailSearchKeyword='';
let passwordVisible=false;
let confirmCallback=null;
let currentGroupFilter='all';
let currentPage=1;
let itemsPerPage=5;
let selectedItems=[];

function getGroups(){
  const encryptedData=localStorage.getItem('emailGroups')||'';
  if(encryptedData){
    try{
      const decrypted=CryptoJS.AES.decrypt(encryptedData,ENCRYPT_KEY).toString(CryptoJS.enc.Utf8);
      return decrypted&&Array.isArray(JSON.parse(decrypted))?JSON.parse(decrypted):['默认分组'];
    }catch(e){return['默认分组'];}
  }
  return['默认分组'];
}
function saveGroups(groups){
  localStorage.setItem('emailGroups',CryptoJS.AES.encrypt(JSON.stringify(groups),ENCRYPT_KEY).toString());
  updateGroupSelectors();
}
function updateGroupSelectors(){
  const groups=getGroups();
  const selectElements=[document.getElementById('group-filter'),document.getElementById('batch-group-select'),document.getElementById('edit-group')];
  selectElements.forEach(select=>{
    if(!select)return;
    const currentValue=select.value;
    select.innerHTML='';
    if(select.id==='group-filter'){
      const allOption=document.createElement('option');
      allOption.value='all';allOption.textContent='全部分组';
      select.appendChild(allOption);
    }else if(select.id==='batch-group-select'){
      const emptyOption=document.createElement('option');
      emptyOption.value='';emptyOption.textContent='选择目标分组';
      select.appendChild(emptyOption);
    }
    groups.forEach(group=>{
      const option=document.createElement('option');
      option.value=group;option.textContent=group;
      select.appendChild(option);
    });
    if(currentValue&&(select.id==='group-filter'||groups.includes(currentValue))){
      select.value=currentValue;
    }
  });
  document.getElementById('group-count').innerText=groups.length;
}

function encryptData(data){
  return CryptoJS.AES.encrypt(JSON.stringify(data),ENCRYPT_KEY).toString();
}
function decryptData(cipherText){
  try{
    const bytes=CryptoJS.AES.decrypt(cipherText,ENCRYPT_KEY);
    return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
  }catch(e){return null;}
}

function showLoading(){document.getElementById('loading-overlay').style.display='flex';}
function hideLoading(){document.getElementById('loading-overlay').style.display='none';}

document.addEventListener('DOMContentLoaded',function(){
  initSelectAll();
  initDragUpload();
  initSearchEnter();
  initGroups();
  loadData();
});
function initGroups(){
  const groups=getGroups();
  if(!groups.includes('默认分组')){
    groups.unshift('默认分组');
    saveGroups(groups);
  }
  updateGroupSelectors();
}

function loadData(){
  const encryptedData=localStorage.getItem('emailData')||'';
  let data=[];
  if(encryptedData)data=decryptData(encryptedData)||[];
  data=data.map(item=>({group:item.group||'默认分组',remark:item.remark||'',...item}));
  localStorage.setItem('emailData',encryptData(data));

  const encryptedPassword=localStorage.getItem('password')||'';
  if(encryptedPassword){
    const decryptedPwd=decryptData(encryptedPassword);
    if(decryptedPwd)document.getElementById('password').value=decryptedPwd;
  }

  let filteredData=data;
  if(currentGroupFilter!=='all')filteredData=filteredData.filter(item=>item.group===currentGroupFilter);
  if(searchKeyword)filteredData=filteredData.filter(item=>item.email.toLowerCase().includes(searchKeyword)||item.remark.toLowerCase().includes(searchKeyword));

  renderTable(filteredData);
  renderPagination(filteredData.length);
  toggleNoData(filteredData.length===0);
  updateDashboard(data);
}
function updateDashboard(data){
  document.getElementById('account-count').innerText=data.length;
}

function renderTable(data){
  const tbody=document.querySelector('#email-table tbody');
  tbody.innerHTML='';
  const start=(currentPage-1)*itemsPerPage;
  const end=start+itemsPerPage;
  const pageData=data.slice(start,end);
  pageData.forEach((item,idx)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><input type="checkbox" data-email="${item.email}"></td>
      <td>${item.email}</td>
      <td class="password-cell">
        <span class="password-text">${passwordVisible?item.password:'••••••••'}</span>
        <button class="password-toggle btn btn-sm btn-default" onclick="toggleSinglePwd(this,'${item.password}')"><i class="fas fa-eye"></i></button>
      </td>
      <td>${item.group||'默认分组'}</td>
      <td class="remark-cell" title="${item.remark||'无备注'}">${item.remark||'无备注'}</td>
      <td>${item.clientId}</td>
      <td class="refresh-token" title="${item.refreshToken}">${item.refreshToken}</td>
      <td>
        <button class="btn btn-primary btn-sm" onclick="viewInbox(${start+idx})">收件箱</button>
        <button class="btn btn-warning btn-sm" onclick="viewJunk(${start+idx})">垃圾箱</button>
        <button class="btn btn-default btn-sm" onclick="editEmail(${start+idx})">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="showDeleteConfirm(${start+idx})">删除</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}
function toggleSinglePwd(btn,pwd){
  const span=btn.previousElementSibling;
  const icon=btn.querySelector('i');
  if(span.textContent==='••••••••'){
    span.textContent=pwd;
    icon.className='fas fa-eye-slash';
  }else{
    span.textContent='••••••••';
    icon.className='fas fa-eye';
  }
}

function initSelectAll(){
  document.getElementById('select-all').addEventListener('change',function(){
    document.querySelectorAll('#email-table tbody input[type="checkbox"]').forEach(cb=>cb.checked=this.checked);
    updateSelectedItems();
  });
  document.querySelector('#email-table tbody').addEventListener('change',e=>{
    if(e.target.type==='checkbox')updateSelectedItems();
  });
}
function updateSelectedItems(){
  const cbs=document.querySelectorAll('#email-table tbody input[type="checkbox"]:checked');
  selectedItems=Array.from(cbs).map(cb=>cb.dataset.email);
}

function batchDelete(){
  if(selectedItems.length===0)return showModal('提示','请先选择要删除的邮箱');
  showConfirmModal('批量删除',`确定删除选中 ${selectedItems.length} 条邮箱？删除不可恢复`,()=>{
    let data=decryptData(localStorage.getItem('emailData'))||[];
    data=data.filter(item=>!selectedItems.includes(item.email));
    localStorage.setItem('emailData',encryptData(data));
    loadData();
    showModal('成功',`已删除 ${selectedItems.length} 条`);
  });
}
function deleteAllEmails(){
  let data=decryptData(localStorage.getItem('emailData'))||[];
  if(data.length===0)return showModal('提示','暂无数据');
  showConfirmModal('警告','确定清空全部邮箱数据？不可恢复',()=>{
    localStorage.removeItem('emailData');
    loadData();
    showModal('成功','已清空所有邮箱数据');
  });
}

function renderPagination(total){
  const pag = document.getElementById('pagination');
  pag.innerHTML = '';
  const totalPage = Math.ceil(total / itemsPerPage);
  if(totalPage === 0) return;

  if(currentPage > 1){
    const prev = document.createElement('button');
    prev.innerText = '上一页';
    prev.onclick = () => changePage(currentPage - 1);
    pag.appendChild(prev);
  }

  let startPage = Math.max(1, currentPage - 5);
  let endPage = Math.min(totalPage, currentPage + 4);

  for(let i = startPage; i <= endPage; i++){
    const btn = document.createElement('button');
    btn.innerText = i;
    if(i === currentPage) btn.classList.add('active');
    btn.onclick = () => changePage(i);
    pag.appendChild(btn);
  }

  if(currentPage < totalPage){
    const next = document.createElement('button');
    next.innerText = '下一页';
    next.onclick = () => changePage(currentPage + 1);
    pag.appendChild(next);
  }
}

function changePage(page){
  currentPage=page;
  let data=decryptData(localStorage.getItem('emailData'))||[];
  let filtered=data;
  if(currentGroupFilter!=='all')filtered=filtered.filter(x=>x.group===currentGroupFilter);
  if(searchKeyword)filtered=filtered.filter(x=>x.email.includes(searchKeyword)||x.remark.includes(searchKeyword));
  renderTable(filtered);
  renderPagination(filtered.length);
}
function changeItemsPerPage(val){
  itemsPerPage=parseInt(val);
  currentPage=1;
  loadData();
}
function toggleNoData(flag){
  document.getElementById('no-data').style.display=flag?'block':'none';
}

function viewInbox(idx){loadMailList(idx,'INBOX');}
function viewJunk(idx){loadMailList(idx,'Junk');}

function loadMailList(tableIndex,mailbox){
  showLoading();
  let data=decryptData(localStorage.getItem('emailData'))||[];
  let filtered=data;
  if(currentGroupFilter!=='all')filtered=filtered.filter(x=>x.group===currentGroupFilter);
  if(searchKeyword)filtered=filtered.filter(x=>x.email.toLowerCase().includes(searchKeyword)||x.remark.toLowerCase().includes(searchKeyword));
  const item=filtered[tableIndex];
  const pwd=decryptData(localStorage.getItem('password'))||'';
  const apiUrl=`/api/mail-all?refresh_token=${item.refreshToken}&client_id=${item.clientId}&email=${item.email}&mailbox=${mailbox}&response_type=json&password=${pwd}`;
  
  fetch(apiUrl).then(res=>{
    if(!res.ok) throw new Error('请求异常');
    return res.json();
  }).then(data=>{
    mailData=data||[];
    originalMailData=[...mailData];
    document.getElementById('mail-card').style.display='block';
    renderMailTable(mailData);
  }).catch(err=>{
    showModal('错误','获取邮件失败：'+err.message);
  }).finally(()=>hideLoading());
}

function renderMailTable(data){
  const tbody=document.querySelector('#mail-table tbody');
  tbody.innerHTML='';
  if(!data || data.length===0){
    tbody.innerHTML='<tr><td colspan="4" style="text-align:center;">暂无邮件</td></tr>';
    return;
  }
  data.forEach((item,idx)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${item.send || '未知'}</td>
      <td>${item.subject || '无主题'}</td>
      <td>${item.date || ''}</td>
      <td><button class="btn btn-primary btn-sm" onclick="viewMail(${idx})">查看</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function viewMail(idx){
  const item=originalMailData[idx];
  if(!item) return;
  document.getElementById('mail-modal-title').innerText=item.subject||'无主题';
  document.getElementById('mail-modal-sender').innerText='发件人：'+(item.send||'未知');
  document.getElementById('mail-modal-subject').innerText='主题：'+(item.subject||'无');
  document.getElementById('mail-modal-date').innerText='日期：'+(item.date||'未知');
  document.getElementById('mail-modal-content').innerHTML=item.html||item.text||'无内容';
  document.getElementById('mail-modal').style.display='flex';
}

function closeMailModal(){
  document.getElementById('mail-modal').style.display='none';
}

function showDeleteConfirm(idx){
  confirmCallback=()=>deleteEmail(idx);
  document.getElementById('confirm-title').innerText='删除确认';
  document.getElementById('confirm-message').innerText='确定删除该邮箱？不可恢复';
  document.getElementById('confirm-modal').style.display='flex';
}
function deleteEmail(idx){
  let data=decryptData(localStorage.getItem('emailData'))||[];
  let filtered=data;
  if(currentGroupFilter!=='all')filtered=filtered.filter(x=>x.group===currentGroupFilter);
  if(searchKeyword)filtered=filtered.filter(x=>x.email.includes(searchKeyword)||x.remark.includes(searchKeyword));
  const realIdx=data.findIndex(x=>x.email===filtered[idx].email);
  if(realIdx>-1){
    data.splice(realIdx,1);
    localStorage.setItem('emailData',encryptData(data));
    loadData();
    showModal('成功','已删除该邮箱');
  }
}

function initDragUpload(){
  const box=document.getElementById('upload-box');
  const file=document.getElementById('file-input');
  const info=document.getElementById('file-info');
  box.onclick=()=>file.click();
  file.onchange=()=>{
    if(file.files[0])info.innerText='已选择：'+file.files[0].name;
  };
  box.ondragover=e=>{e.preventDefault();box.classList.add('dragover');};
  box.ondragleave=()=>box.classList.remove('dragover');
  box.ondrop=e=>{
    e.preventDefault();box.classList.remove('dragover');
    if(e.dataTransfer.files.length)file.files=e.dataTransfer.files;
    if(file.files[0])info.innerText='已选择：'+file.files[0].name;
  };
}

// ===================== 【修复】大量导入邮箱永不卡死 + 进度条 ========================
async function importEmails() {
  const delimiter = document.getElementById('delimiter').value.trim();
  const file = document.getElementById('file-input');
  if (!delimiter) return showModal('错误', '请输入分隔符');
  if (!file.files.length) return showModal('错误', '请选择TXT文件');

  const progressContainer = document.getElementById('progress-container');
  const progressBar = document.getElementById('progress-bar');
  const importStatus = document.getElementById('import-status');
  
  progressContainer.style.display = 'block';
  importStatus.style.display = 'block';
  progressBar.style.width = '0%';

  const f = file.files[0];
  const reader = new FileReader();
  reader.readAsText(f);

  reader.onload = async function (e) {
    const lines = e.target.result.split('\n').filter(x => x.trim());
    const totalLines = lines.length;
    let data = decryptData(localStorage.getItem('emailData')) || [];
    const existEmails = new Set(data.map(x => x.email.toLowerCase().trim()));

    let ok = 0, dup = 0, errLine = 0;
    const BATCH_SIZE = 30;

    for (let i = 0; i < totalLines; i += BATCH_SIZE) {
      const batch = lines.slice(i, i + BATCH_SIZE);

      batch.forEach(line => {
        const parts = line.split(delimiter).map(x => x.trim());
        if (parts.length >= 4) {
          let email = parts[0];
          const pwd = parts[1];
          const cid = parts[2];
          const rt = parts[3];

          if (!email || !pwd || !cid || !rt) { errLine++; return; }

          const emailLower = email.toLowerCase();
          if (existEmails.has(emailLower)) { dup++; return; }

          data.push({
            email: email,
            password: pwd,
            clientId: cid,
            refreshToken: rt,
            group: '默认分组',
            remark: ''
          });
          existEmails.add(emailLower);
          ok++;
        } else {
          errLine++;
        }
      });

      const current = Math.min(i + BATCH_SIZE, totalLines);
      const percent = (current / totalLines) * 100;
      progressBar.style.width = percent + '%';
      importStatus.innerText = `导入中：${current}/${totalLines} 成功：${ok} 重复：${dup}`;
      await new Promise(r => setTimeout(r, 5));
    }

    localStorage.setItem('emailData', encryptData(data));
    loadData();
    
    progressBar.style.width = '100%';
    importStatus.innerText = `✅ 导入完成！成功：${ok} 重复：${dup} 错误：${errLine}`;

    setTimeout(() => {
      progressContainer.style.display = 'none';
      importStatus.style.display = 'none';
    }, 2000);

    file.value = '';
    document.getElementById('file-info').innerText = '';
    showModal('导入成功', `成功：${ok} 条<br>重复：${dup} 条<br>错误：${errLine} 条`);
  };
}

function exportData(){
  let data=decryptData(localStorage.getItem('emailData'))||[];
  if(!data.length)return showModal('提示','暂无数据可导出');
  const txt=data.map(item=>`${item.email}----${item.password}----${item.group||'默认分组'}----${item.remark||''}----${item.clientId}----${item.refreshToken}`).join('\n');
  const blob=new Blob([txt],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`邮箱备份_${new Date().toLocaleDateString()}.txt`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  showModal('成功','已导出TXT备份');
}

function toggleAllPasswords(){
  passwordVisible=!passwordVisible;
  document.querySelectorAll('.password-text').forEach((span,i)=>{
    const row = span.closest('tr');
    if(!row) return;
    const toggleBtn = row.querySelector('.password-toggle');
    if(!toggleBtn) return;
    
    const pwdMatch = toggleBtn.getAttribute('onclick').match(/'([^']+)'/);
    const pwd = pwdMatch ? pwdMatch[1] : '';
    
    span.textContent=passwordVisible?pwd:'••••••••';
    const icon=toggleBtn.querySelector('i');
    if(icon) icon.className=passwordVisible?'fas fa-eye-slash':'fas fa-eye';
  });
}

function initSearchEnter(){
  document.getElementById('email-search').addEventListener('keypress',e=>{if(e.key==='Enter')searchEmails();});
}
function searchEmails(){
  searchKeyword=document.getElementById('email-search').value.trim().toLowerCase();
  currentPage=1;loadData();
}
function clearSearch(){
  document.getElementById('email-search').value='';searchKeyword='';currentPage=1;loadData();
}
function setPassword(){
  const pwd=document.getElementById('password').value;
  if(pwd)localStorage.setItem('password',encryptData(pwd));
  else localStorage.removeItem('password');
}

function createGroup(){
  const name=document.getElementById('new-group').value.trim();
  if(!name)return showModal('错误','请输入分组名称');
  const groups=getGroups();
  if(groups.includes(name))return showModal('错误','分组已存在');
  groups.push(name);saveGroups(groups);
  document.getElementById('new-group').value='';
  showModal('成功','分组创建完成');
}
function deleteSelectedGroup(){
  const val=document.getElementById('group-filter').value;
  if(val==='all'||val==='默认分组')return showModal('错误','禁止删除该分组');
  const groups=getGroups();
  let data=decryptData(localStorage.getItem('emailData'))||[];
  const has=data.some(x=>x.group===val);
  if(has){
    showConfirmModal('删除分组','该分组下有邮箱，删除后自动移入默认分组',()=>{
      data=data.map(x=>x.group===val?{...x,group:'默认分组'}:x);
      localStorage.setItem('emailData',encryptData(data));
      const idx=groups.indexOf(val);
      groups.splice(idx,1);saveGroups(groups);
      currentGroupFilter='all';
      document.getElementById('group-filter').value='all';
      loadData();
      showModal('成功','分组已删除，邮箱已移入默认分组');
    });
  }else{
    const idx=groups.indexOf(val);
    groups.splice(idx,1);saveGroups(groups);
    currentGroupFilter='all';
    document.getElementById('group-filter').value='all';
    loadData();
    showModal('成功','分组已删除');
  }
}
function filterByGroup(){
  currentGroupFilter=document.getElementById('group-filter').value;
  currentPage=1;loadData();
}

function showBatchGroupConfirm(){
  const target=document.getElementById('batch-group-select').value;
  if(!target)return showModal('错误','请选择目标分组');
  if(selectedItems.length===0)return showModal('错误','请选择邮箱');
  document.getElementById('selected-count').innerText=selectedItems.length;
  document.getElementById('target-group-name').innerText=target;
  document.getElementById('batch-group-modal').style.display='flex';
}
function confirmBatchGroup(){
  const target=document.getElementById('batch-group-select').value;
  let data=decryptData(localStorage.getItem('emailData'))||[];
  data=data.map(x=>selectedItems.includes(x.email)?{...x,group:target}:x);
  localStorage.setItem('emailData',encryptData(data));
  closeBatchGroupModal();
  loadData();
  showModal('成功',`已将 ${selectedItems.length} 个邮箱移入分组：${target}`);
}
function closeBatchGroupModal(){document.getElementById('batch-group-modal').style.display='none';}

function editEmail(idx){
  let data=decryptData(localStorage.getItem('emailData'))||[];
  let filtered=data;
  if(currentGroupFilter!=='all')filtered=filtered.filter(x=>x.group===currentGroupFilter);
  if(searchKeyword)filtered=filtered.filter(x=>x.email.toLowerCase().includes(searchKeyword)||x.remark.toLowerCase().includes(searchKeyword));
  const item=filtered[idx];
  document.getElementById('edit-email-original').value=item.email;
  document.getElementById('edit-email').value=item.email;
  document.getElementById('edit-password').value=item.password;
  document.getElementById('edit-client-id').value=item.clientId;
  document.getElementById('edit-refresh-token').value=item.refreshToken;
  document.getElementById('edit-remark').value=item.remark||'';
  document.getElementById('edit-group').value=item.group||'默认分组';
  document.getElementById('edit-modal').style.display='flex';
}
function closeEditModal(){document.getElementById('edit-modal').style.display='none';}
function saveEdit(){
  const email=document.getElementById('edit-email-original').value;
  const pwd=document.getElementById('edit-password').value;
  const group=document.getElementById('edit-group').value;
  const remark=document.getElementById('edit-remark').value;
  const cid=document.getElementById('edit-client-id').value;
  const rt=document.getElementById('edit-refresh-token').value;
  if(!email||!pwd||!cid||!rt)return showModal('错误','必填项不能为空');
  let data=decryptData(localStorage.getItem('emailData'))||[];
  const idx=data.findIndex(x=>x.email===email);
  if(idx>-1){
    data[idx]={...data[idx],password:pwd,group,remark,clientId:cid,refreshToken:rt};
    localStorage.setItem('emailData',encryptData(data));
    closeEditModal();
    loadData();
    showModal('成功','修改已保存');
  }
}

function showModal(title,msg){
  document.getElementById('modal-title').innerText=title;
  document.getElementById('modal-message').innerHTML=msg;
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}

function showConfirmModal(title,msg,cb){
  confirmCallback=cb;
  document.getElementById('confirm-title').innerText=title;
  document.getElementById('confirm-message').innerHTML=msg;
  document.getElementById('confirm-modal').style.display='flex';
}
function closeConfirmModal(){document.getElementById('confirm-modal').style.display='none';}
function confirmAction(){
  closeConfirmModal();
  if(confirmCallback)confirmCallback();
}
